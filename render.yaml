# Blueprint do Render: descreve o serviço do backend.
# No painel: New > Blueprint > escolha este repositório. Passo a passo no DEPLOY.md.
# Variáveis com "sync: false" são segredos: o Render pede o valor na criação e ele nunca fica no repositório.
services:
  - type: web
    name: moedy-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    # Só refaz o deploy quando algo do backend muda (o frontend é publicado pela Vercel).
    buildFilter:
      paths:
        - backend/**
        - package.json
        - yarn.lock
        - .yarnrc.yml
        - .yarn/releases/**
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      # A porta (PORT) é definida pelo próprio Render; não declare aqui.

      # --- Segredos: preencher manualmente ---
      - key: DATABASE_URL # URL de conexão do PostgreSQL
        sync: false
      - key: JWT_SECRET # no mínimo 32 caracteres: openssl rand -base64 48
        sync: false
      - key: CORS_ORIGIN # endereço do frontend na Vercel, sem barra no final
        sync: false
      - key: ANTHROPIC_API_KEY # opcional: sugestão de categorias por IA
        sync: false

      # --- Configuração ---
      # Deixe true só até criar o seu usuário; depois mude para false.
      - key: REGISTRATION_ENABLED
        value: "true"
      - key: AI_MODEL
        value: claude-haiku-4-5-20251001
      - key: LOG_LEVEL
        value: info
