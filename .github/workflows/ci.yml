name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Typecheck, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      # --immutable: falha se o yarn.lock não bater com os package.json
      - name: Instalar dependências
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Lint do frontend
        run: yarn workspace frontend lint

      - name: Testes
        run: yarn test

      - name: Build do backend e do frontend
        run: yarn build

  docker:
    name: Imagem Docker do backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Só valida que a imagem constrói; nada é publicado.
      - name: Construir a imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
